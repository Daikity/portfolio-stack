# Оркестрация портфолио: proxy + mongo + landing (+ демо из sync)
name: portfolio

include:
  - path: docker-compose.demos.generated.yml

networks:
  portfolio:
    driver: bridge

volumes:
  mongo_data:

services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/demos.generated.conf:/etc/nginx/conf.d/demos.generated.conf:ro
    depends_on:
      - landing
    networks:
      - portfolio

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio

  landing:
    build:
      context: ./igor-edison-personal
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-portfolio}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me}
      PROJECTS_ROOT: /projects
    volumes:
      # Реестр проектов для GET /api/projects
      - ./:/projects:ro
    depends_on:
      - mongo
    networks:
      - portfolio
