# Автогенерация: node scripts/portfolio-sync.mjs — не править вручную

# FlowCRM → demo-flowcrm
location /demos/flowcrm/ {
  proxy_pass http://demo-flowcrm:80/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# ShopAdmin → demo-shopadmin
location /demos/shopadmin/ {
  proxy_pass http://demo-shopadmin:80/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
